<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قسم المواد المنزلية</title>
  </head>
  <body>
    <header>
      <img src="img/logo.png" alt="شعار المتجر (QJN)" class="logo" />
      <nav class="navbar">
        <ul>
          <li><a href="index.html#items">العودة</a></li>
        </ul>
      </nav>
    </header>
    <hr />
    <section class="sell-home-item">
      <p class="sell-home-item-title">قسم المواد المنزلية</p>
      <div class="home-item-section">
        <div class="sell-card-home-item">
          <img src="img/home-item1.jpeg" alt="اساور الاصدقاء" />
          <p class="price">30000 دينار عراقي</p>
        </div>
        <div class="sell-card-home-item">
          <img src="img/home-item2.jpeg" alt="اساور" />
          <p class="price">10000 دينار عراقي</p>
        </div>
        <div class="sell-card-home-item">
          <img src="img/home-item3.jpeg" alt="اسوارة" />
          <p class="price">10000 دينار عراقي</p>
        </div>
      </div>
      <div class="home-item-section">
        <div class="sell-card-home-item">
          <img src="img/home-item4.jpeg" alt="اساور الاصدقاء" />
          <p class="price">15000 دينار عراقي</p>
        </div>
      </div>
      <h1 class="note1">ملاحظة:</h1>
      <h2 class="note2">يتغير السعر حسب الحجم ونوع الخرز</h2>
    </section>
    <div
      id="products-list"
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
      "
    ></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        query,
        where,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // إعدادات الفايربيس الخاصة بك
      const firebaseConfig = {
        apiKey: "AIzaSyB1tLfOZFokj2yBNM_ILcIj5VcTJf1X-Nw",
        authDomain: "janat-shop.firebaseapp.com",
        projectId: "janat-shop",
        storageBucket: "janat-shop.firebasestorage.app",
        messagingSenderId: "940262782144",
        appId: "1:940262782144:web:f0ef11cb908d212795e925",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // --- هنا التغيير لكل صفحة ---
      // في صفحة الحقائب اكتب "bags" | في الميداليات "medal" | في الإكسسوارات "acs" | في المنزلية "home"
      const q = query(
        collection(db, "products"),
        where("category", "==", "home-item"),
      );

      onSnapshot(q, (snapshot) => {
        const container = document.getElementById("products-list");
        container.innerHTML = "";
        snapshot.forEach((doc) => {
          const p = doc.data();
          container.innerHTML += `
                <div style="background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 220px; padding: 15px; text-align: center;">
                    <img src="${p.img}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px;">
                    <h3 style="margin: 10px 0; font-size: 1.1rem; color: #333;">${p.name}</h3>
                    <p style="color: #e94560; font-weight: bold; font-size: 1.2rem;">${p.price} د.ع</p>
                </div>`;
        });
      });
    </script>
  </body>
</html>
