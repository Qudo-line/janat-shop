<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #16213e; padding: 25px; border-radius: 15px; border: 1px solid #e94560; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; background: #f0f0f0; color: black; }
        .file-label { display: block; background: #0f3460; padding: 20px; cursor: pointer; border-radius: 10px; border: 2px dashed #e94560; margin: 15px 0; }
        .add-btn { background: #e94560; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>إضافة منتج جديد 🛍️</h2>
        <input type="number" id="pPrice" placeholder="السعر (د.ع)">
        <select id="pCategory">
            <option value="bags">حقائب</option>
            <option value="medal">ميداليات</option>
        </select>
        <label class="file-label">
            اختر صورة المنتج 🖼️
            <input type="file" id="pImgFile" accept="image/*" style="display: none;">
        </label>
        <span id="status" style="display:block; margin-bottom:10px;">لم يتم اختيار صورة</span>
        <button class="add-btn" id="sendBtn">إرسال للمتجر (+)</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1tLfOZFokj2yBNM_ILcIj5VcTJf1X-Nw",
            authDomain: "janat-shop.firebaseapp.com",
            projectId: "janat-shop",
            storageBucket: "janat-shop.firebasestorage.app",
            messagingSenderId: "940262782144",
            appId: "1:940262782144:web:f0ef11cb908d212795e925"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("pImgFile").onchange = (e) => {
            if (e.target.files.length > 0) document.getElementById("status").innerText = "تم اختيار الصورة ✅";
        };

        document.getElementById("sendBtn").onclick = async () => {
            const price = document.getElementById("pPrice").value;
            const file = document.getElementById("pImgFile").files[0];
            const status = document.getElementById("status");

            if (!price || !file) return alert("اكمل البيانات!");

            status.innerText = "جاري الرفع... ⏳";
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async (e) => {
                try {
                    await addDoc(collection(db, "products"), {
                        price: price,
                        category: document.getElementById("pCategory").value,
                        img: e.target.result,
                        date: new Date()
                    });
                    alert("تم الإضافة! الصور هسة تطلع بالموقع");
                    document.getElementById("pPrice").value = "";
                    document.getElementById("pImgFile").value = "";
                    status.innerText = "لم يتم اختيار صورة";
                } catch (err) {
                    alert("خطأ بالرفع");
                }
            };
        };
    </script>
</body>
</html>
