<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - إضافة منتجات</title>
    </head>
<body>

    <div class="admin-container">
        <h2>🛍️ إضافة منتج جديد</h2>
        <input type="number" id="price-input" placeholder="السعر">
        <select id="category-select">
            <option value="medal">قسم الميداليات</option>
            <option value="acs">قسم الإكسسوارات</option>
            <option value="bags">قسم الحقائب</option>
            <option value="home-item">قسم المنزل</option>
        </select>
        <input type="file" id="file-input" accept="image/*">
        <button id="upload-btn">رفع للقسم المختار</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ضع هنا Firebase Config الخاص بك (الموجود في صورك السابقة)
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "janat-shop.firebaseapp.com",
            projectId: "janat-shop",
            storageBucket: "janat-shop.appspot.com",
            messagingSenderId: "940262782144",
            appId: "1:940262782144:web:f0ef11cb908d212795e925"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 1. دالة ضغط الصور (لحل مشكلة الحجم) ---
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // تصغير العرض لتقليل الحجم
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // تحويل الصورة لـ Base64 مضغوط (جودة 0.6 كافية جداً)
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    callback(compressedBase64);
                };
            };
        }

        // --- 2. دالة الرفع عند الضغط على الزر ---
        document.getElementById("upload-btn").onclick = function() {
            const fileInput = document.getElementById("file-input");
            const file = fileInput.files[0];
            const price = document.getElementById("price-input").value;
            const category = document.getElementById("category-select").value;

            if (!file || !price) {
                alert("يرجى ملء كافة الحقول واختيار صورة");
                return;
            }

            console.log("جاري معالجة الصورة...");

            // استدعاء الضغط أولاً
            compressImage(file, async (compressedBase64) => {
                try {
                    // الرفع للفايربيس باستخدام النسخة المضغوطة
                    await addDoc(collection(db, "products"), {
                        img: compressedBase64, 
                        price: price,
                        category: category,
                        timestamp: serverTimestamp()
                    });

                    alert("تم الرفع بنجاح!");
                    location.reload(); 
                } catch (error) {
                    console.error("Error adding document: ", error);
                    alert("فشل الرفع: " + error.message);
                }
            });
        };
    </script>
</body>
</html>
