<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>لوحة التحكم | متجر جنات</title>
    <style>
      body {
        font-family: sans-serif;
        background: #1a1a2e;
        color: white;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 400px;
        margin: auto;
        background: #16213e;
        padding: 25px;
        border-radius: 15px;
        border: 2px solid #e94560;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
      }
      .add-btn {
        background: #e94560;
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        cursor: pointer;
        border-radius: 8px;
        font-weight: bold;
      }
      .admin-card {
        background: #0f3460;
        padding: 10px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        margin-top: 10px;
        border: 1px solid #333;
        justify-content: space-between;
      }
      .admin-card img {
        width: 50px;
        height: 50px;
        border-radius: 5px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>إضافة منتج جديد 🛍️</h2>
      <input type="number" id="pPrice" placeholder="السعر" />
      <select id="pCategory">
        <option value="bags">قسم الحقائب</option>
        <option value="medal">قسم الميداليات</option>
        <option value="acs">قسم الإكسسوارات</option>
        <option value="home">المواد المنزلية</option>
      </select>
      <input type="file" id="pImgFile" accept="image/*" />
      <p id="status" style="font-weight: bold">جاهز</p>
      <button class="add-btn" id="sendBtn">رفع للقسم المختار</button>
    </div>

    <h3 style="margin-top: 20px">إدارة المنشورات 🛠️</h3>
    <div id="admin-list" style="max-width: 400px; margin: auto"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        query,
        orderBy,
        doc,
        deleteDoc,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB1tLfOZFokj2yBNM_ILcIj5VcTJf1X-Nw",
        authDomain: "janat-shop.firebaseapp.com",
        projectId: "janat-shop",
        storageBucket: "janat-shop.firebasestorage.app",
        messagingSenderId: "940262782144",
        appId: "1:940262782144:web:f0ef11cb908d212795e925",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // --- دالة الرفع المعدلة ---
      document.getElementById("sendBtn").onclick = async () => {
        const price = document.getElementById("pPrice").value;
        const file = document.getElementById("pImgFile").files[0];
        const cat = document.getElementById("pCategory").value;
        const statusLabel = document.getElementById("status");

        if (!price || !file) return alert("أكمل البيانات (السعر والصورة)");

        statusLabel.innerText = "جاري الرفع... انتظر قليلاً ⏳";
        statusLabel.style.color = "#ffcc00";

        const reader = new FileReader();
        reader.readAsDataURL(file);

        reader.onload = async (e) => {
          try {
            // الرفع الفعلي للفايربيس
            const docRef = await addDoc(collection(db, "products"), {
              price: price,
              category: cat,
              img: e.target.result,
              date: new Date(),
            });

            console.log("تم الرفع بالرمز: ", docRef.id);
            statusLabel.innerText = "تم الرفع بنجاح! ✅ الرمز: " + docRef.id;
            statusLabel.style.color = "#00ff00";
            alert("تمت الإضافة بنجاح!");

            // تحديث الصفحة لرؤية النتائج
            setTimeout(() => {
              location.reload();
            }, 1000);
          } catch (error) {
            console.error("خطأ في الرفع: ", error);
            statusLabel.innerText = "فشل الرفع: " + error.message;
            statusLabel.style.color = "red";
          }
        };

        reader.onerror = () => {
          statusLabel.innerText = "فشل قراءة ملف الصورة!";
          statusLabel.style.color = "red";
        };
      };

      // --- عرض المنشورات ---
      onSnapshot(
        query(collection(db, "products"), orderBy("date", "desc")),
        (snapshot) => {
          const list = document.getElementById("admin-list");
          list.innerHTML = "";
          snapshot.forEach((pDoc) => {
            const item = pDoc.data();
            list.innerHTML += `
                <div class="admin-card">
                    <img src="${item.img}">
                    <span>${item.price} - ${item.category}</span>
                    <button onclick="deleteItem('${pDoc.id}')" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">حذف</button>
                </div>`;
          });
        },
      );

      // --- دالة الحذف ---
      window.deleteItem = async (id) => {
        if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
          try {
            await deleteDoc(doc(db, "products", id));
          } catch (error) {
            alert("خطأ في الحذف: " + error.message);
          }
        }
      };
      // دالة لضغط الصورة قبل تحويلها لـ Base64
      function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800; // تصغير العرض لـ 800 بكسل كحد أقصى
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            // تحويل الصورة لـ Base64 بجودة مضغوطة (0.7 يعني 70% من الجودة الأصلية)
            const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
            callback(compressedBase64);
          };
        };
      }

      // عند الضغط على زر "رفع للقسم المختار"
      document.getElementById("upload-btn").onclick = function () {
        const file = document.getElementById("file-input").files[0];
        if (file) {
          compressImage(file, (compressedBase64) => {
            // هنا تحط كود الـ addDoc مالتك وتستخدم compressedBase64 بدلاً من الملف الأصلي
            console.log("تم ضغط الصورة، الحجم الجديد جاهز للرفع!");
            // كود الرفع الخاص بك يكمل هنا...
          });
        }
      };
    </script>
  </body>
</html>
