<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قسم الاكسسوارات</title>
  </head>
  <body>
    <header>
      <img src="img/logo.png" alt="شعار المتجر (QJN)" class="logo" />
      <nav class="navbar">
        <ul>
          <li><a href="index.html#items">العودة</a></li>
        </ul>
      </nav>
    </header>
    <hr />
    <section class="sell-acs">
      <p class="sell-acs-title">قسم الاكسسوارات</p>
      <div class="acs-section">
        <div class="sell-card-acs">
          <img src="img/acs1.jpeg" alt="اساور الاصدقاء" />
          <p class="price">1000 دينار عراقي</p>
        </div>
        <div class="sell-card-acs">
          <img src="img/acs3.jpeg" alt="اساور" />
          <p class="price">1000 دينار عراقي</p>
        </div>
        <div class="sell-card-acs">
          <img src="img/acs2.jpeg" alt="اسوارة" />
          <p class="price">1000 دينار عراقي</p>
        </div>
      </div>
      <div id="acs-container" class="acs-section"></div>
      <h1 class="note1">ملاحظة:</h1>
      <h2 class="note2">يتغير السعر حسب الحجم ونوع الخرز</h2>
    </section>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        onSnapshot,
        query,
        where,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      const firebaseConfig = {
        apiKey: "AIzaSyB1tLfOZFokj2yBNM_ILcIj5VcTJf1X-Nw",
        authDomain: "janat-shop.firebaseapp.com",
        projectId: "janat-shop",
        storageBucket: "janat-shop.firebasestorage.app",
        messagingSenderId: "940262782144",
        appId: "1:940262782144:web:f0ef11cb908d212795e925",
      };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const q = query(
        collection(db, "products"),
        where("category", "==", "acs"),
      );
      const container = document.getElementById("acs-container");

      onSnapshot(q, (snapshot) => {
        container.innerHTML = "";
        snapshot.forEach((doc) => {
          const item = doc.data();

          // استخدام كلاس sell-card-acs للترتيب وكلاس price للنص
          container.innerHTML += `
            <div class="sell-card-acs">
                <img src="${item.img}">
                <p class="price">السعر: ${item.price} دينار عراقي</p>
            </div>
        `;
        });
      });
    </script>
  </body>
</html>
